<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Jut — Changelog</title>
<meta name="description" content="Every update to Jut for Mac, in one place.">
<style>
  :root {
    --bg: #0b0b0f;
    --bg-soft: #14141b;
    --card: rgba(255,255,255,0.035);
    --card-border: rgba(255,255,255,0.08);
    --text: #f4f4f7;
    --muted: #9a9aa6;
    --faint: #6a6a76;
    /* brand gradient (from the app icon) */
    --g1: #FFCF97; --g2: #FF8158; --g3: #FF625F; --g4: #FF3F72; --g5: #E71E79;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  html { scroll-behavior: smooth; }

  body {
    background:
      radial-gradient(1200px 600px at 50% -10%, rgba(255,63,114,0.10), transparent 60%),
      radial-gradient(900px 500px at 85% 10%, rgba(255,129,88,0.08), transparent 55%),
      var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Helvetica Neue", Arial, sans-serif;
    line-height: 1.6;
    -webkit-font-smoothing: antialiased;
    min-height: 100vh;
  }

  .wrap { max-width: 760px; margin: 0 auto; padding: 0 22px 120px; }

  /* ---------- Header ---------- */
  header {
    text-align: center;
    padding: 72px 0 46px;
  }

  .logo {
    width: 96px; height: 96px; margin: 0 auto 22px; display: block;
    border-radius: 22px;
    filter: drop-shadow(0 14px 40px rgba(255,63,114,0.28));
  }

  h1 {
    font-size: clamp(30px, 6vw, 46px);
    font-weight: 800;
    letter-spacing: -0.02em;
    background: linear-gradient(120deg, var(--g1), var(--g3) 45%, var(--g5));
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
  }

  header p { color: var(--muted); margin-top: 10px; font-size: 16px; }

  /* ---------- Timeline ---------- */
  .timeline { position: relative; }

  .release {
    position: relative;
    padding: 26px 26px 22px;
    margin-bottom: 22px;
    background: var(--card);
    border: 1px solid var(--card-border);
    border-radius: 20px;
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
  }

  .release.latest {
    border-color: rgba(255,63,114,0.35);
    box-shadow: 0 0 0 1px rgba(255,63,114,0.10), 0 20px 60px -30px rgba(255,63,114,0.5);
  }

  .rel-head {
    display: flex;
    align-items: center;
    flex-wrap: wrap;
    gap: 10px 14px;
    margin-bottom: 16px;
  }

  .version {
    font-size: 24px;
    font-weight: 800;
    letter-spacing: -0.01em;
    display: inline-flex;
    align-items: baseline;
    gap: 8px;
  }
  .version .v-prefix { color: var(--faint); font-weight: 600; font-size: 18px; }

  .badge {
    font-size: 12px;
    font-weight: 700;
    padding: 3px 10px;
    border-radius: 999px;
    letter-spacing: 0.02em;
    background: linear-gradient(120deg, var(--g2), var(--g4));
    color: #fff;
  }

  .meta {
    margin-left: auto;
    display: flex;
    gap: 16px;
    flex-wrap: wrap;
    color: var(--muted);
    font-size: 13px;
  }
  .meta span { display: inline-flex; align-items: center; gap: 5px; white-space: nowrap; }

  /* ---------- Release notes body ---------- */
  .notes { color: #dcdce4; font-size: 15px; }
  .notes h1, .notes h2, .notes h3 { color: #fff; margin: 18px 0 8px; font-weight: 700; }
  .notes h1 { font-size: 19px; } .notes h2 { font-size: 17px; } .notes h3 { font-size: 15px; }
  .notes h1:first-child, .notes h2:first-child, .notes h3:first-child { margin-top: 0; }
  .notes ul, .notes ol { padding-left: 22px; margin: 6px 0 12px; }
  .notes li { margin: 4px 0; }
  .notes p { margin: 8px 0; }
  .notes a { color: var(--g4); text-decoration: none; border-bottom: 1px solid rgba(255,63,114,0.3); }
  .notes a:hover { border-bottom-color: var(--g4); }
  .notes code {
    background: rgba(255,255,255,0.08); padding: 1px 6px;
    border-radius: 6px; font-size: 0.9em;
    font-family: "SF Mono", ui-monospace, Menlo, monospace;
  }
  .notes img { max-width: 100%; border-radius: 12px; margin: 10px 0; }
  .notes hr { border: none; border-top: 1px solid var(--card-border); margin: 16px 0; }

  /* ---------- Download button ---------- */
  .dl {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    margin-top: 18px;
    padding: 9px 18px;
    font-size: 14px;
    font-weight: 700;
    color: #fff;
    text-decoration: none;
    border-radius: 12px;
    background: linear-gradient(120deg, var(--g3), var(--g5));
    transition: transform .12s ease, filter .12s ease;
  }
  .dl:hover { transform: translateY(-1px); filter: brightness(1.08); }
  .dl:active { transform: translateY(0); }

  /* ---------- States ---------- */
  .state { text-align: center; padding: 60px 20px; color: var(--muted); }
  .spinner {
    width: 34px; height: 34px; margin: 0 auto 18px;
    border: 3px solid rgba(255,255,255,0.12);
    border-top-color: var(--g4);
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  .state .retry {
    display: inline-block; margin-top: 14px; color: var(--g4);
    cursor: pointer; text-decoration: underline;
  }

  footer {
    text-align: center;
    color: var(--faint);
    font-size: 13px;
    padding-top: 40px;
  }
  footer a { color: var(--muted); text-decoration: none; }
  footer a:hover { color: var(--g4); }
</style>
</head>
<body>
<div class="wrap">

  <header>
    <img class="logo" src="icon.png" alt="Jut app icon" width="96" height="96">
    <h1>Changelog</h1>
    <p>Every update to Jut, in one place.</p>
  </header>

  <main id="content" class="timeline">
    <div class="state">
      <div class="spinner"></div>
      Loading releases…
    </div>
  </main>

  <footer>
    <a href="https://github.com/vvinys" target="_blank" rel="noopener">Jut</a>
    · Auto-generated from the Sparkle appcast
  </footer>

</div>

<script>
  // Read appcast.xml same-origin (a GitHub Action copies it from the release next to this file on deploy).
  // We do this because GitHub release assets don't send CORS headers, so a cross-origin fetch would be blocked.
  const APPCAST_URL = "./appcast.xml";

  const SPARKLE_NS = "http://www.andymatuschak.org/xml-namespaces/sparkle";
  const content = document.getElementById("content");

  const escapeHTML = (s) => s.replace(/[&<>"']/g, c =>
    ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));

  function fmtDate(pubDate) {
    if (!pubDate) return "";
    const d = new Date(pubDate);
    if (isNaN(d)) return "";
    return d.toLocaleDateString("en-US", { year: "numeric", month: "long", day: "numeric" });
  }

  function fmtSize(bytes) {
    const n = parseInt(bytes, 10);
    if (!n || isNaN(n)) return "";
    const mb = n / (1024 * 1024);
    return mb >= 1 ? mb.toFixed(1) + " MB" : Math.round(n / 1024) + " KB";
  }

  // sparkle:* must be read through the namespace — some parsers won't match a raw prefixed query.
  const sparkleAttr = (enc, name) =>
    enc?.getAttributeNS(SPARKLE_NS, name) || enc?.getAttribute("sparkle:" + name) || "";

  function textOf(item, tag) {
    // Try namespaced first, then fall back to the raw tag name.
    let el = item.getElementsByTagNameNS(SPARKLE_NS, tag)[0];
    if (!el) el = item.getElementsByTagName("sparkle:" + tag)[0];
    if (!el) el = item.getElementsByTagName(tag)[0];
    return el ? el.textContent.trim() : "";
  }

  // Release notes: either embedded in <description> or linked via <sparkle:releaseNotesLink>.
  async function getNotes(item) {
    const desc = item.getElementsByTagName("description")[0];
    if (desc && desc.textContent.trim()) return desc.textContent;

    const link = textOf(item, "releaseNotesLink");
    if (link) {
      try {
        const r = await fetch(link);
        if (r.ok) return await r.text();
      } catch (_) { /* no notes — leave empty */ }
    }
    return "";
  }

  function versionKey(v) {
    return (v || "0").split(/[.\-]/).map(n => parseInt(n, 10) || 0);
  }
  function compareVersions(a, b) {
    const A = versionKey(a), B = versionKey(b);
    const len = Math.max(A.length, B.length);
    for (let i = 0; i < len; i++) {
      const diff = (B[i] || 0) - (A[i] || 0);
      if (diff) return diff;
    }
    return 0;
  }

  function renderError(msg) {
    content.innerHTML = `
      <div class="state">
        Couldn't load the changelog<br>
        <small style="color:var(--faint)">${escapeHTML(msg)}</small><br>
        <span class="retry" onclick="load()">Retry</span>
      </div>`;
  }

  async function load() {
    content.innerHTML = `<div class="state"><div class="spinner"></div>Loading releases…</div>`;
    let xmlText;
    try {
      const res = await fetch(APPCAST_URL, { cache: "no-cache" });
      if (!res.ok) throw new Error("HTTP " + res.status);
      xmlText = await res.text();
    } catch (e) {
      return renderError(e.message || "network error");
    }

    const doc = new DOMParser().parseFromString(xmlText, "application/xml");
    if (doc.getElementsByTagName("parsererror").length) {
      return renderError("Invalid appcast.xml");
    }

    const items = Array.from(doc.getElementsByTagName("item"));
    if (!items.length) return renderError("No versions found in the appcast");

    // Build each release (fetching linked notes where present).
    const releases = await Promise.all(items.map(async (item) => {
      const enc = item.getElementsByTagName("enclosure")[0];
      const shortVer = textOf(item, "shortVersionString")
        || sparkleAttr(enc, "shortVersionString");
      const buildVer = textOf(item, "version") || sparkleAttr(enc, "version");
      return {
        short: shortVer || buildVer || "?",
        build: buildVer && buildVer !== shortVer ? buildVer : "",
        date: fmtDate(textOf(item, "pubDate") ||
          (item.getElementsByTagName("pubDate")[0]?.textContent)),
        minOS: textOf(item, "minimumSystemVersion"),
        url: enc?.getAttribute("url") || "",
        size: fmtSize(enc?.getAttribute("length")),
        notes: await getNotes(item),
      };
    }));

    releases.sort((a, b) => compareVersions(a.short, b.short));

    content.innerHTML = releases.map((r, i) => `
      <article class="release${i === 0 ? " latest" : ""}">
        <div class="rel-head">
          <span class="version">
            <span class="v-prefix">v</span>${escapeHTML(r.short)}
            ${r.build ? `<span class="v-prefix" style="font-size:14px">(${escapeHTML(r.build)})</span>` : ""}
          </span>
          ${i === 0 ? `<span class="badge">Latest</span>` : ""}
          <span class="meta">
            ${r.date ? `<span>📅 ${escapeHTML(r.date)}</span>` : ""}
            ${r.minOS ? `<span>💻 macOS ${escapeHTML(r.minOS)}+</span>` : ""}
            ${r.size ? `<span>⬇︎ ${escapeHTML(r.size)}</span>` : ""}
          </span>
        </div>
        <div class="notes">${r.notes || "<p style='color:var(--faint)'>No release notes for this version.</p>"}</div>
        ${r.url ? `<a class="dl" href="${escapeHTML(r.url)}">Download</a>` : ""}
      </article>
    `).join("");
  }

  load();
</script>
</body>
</html>
