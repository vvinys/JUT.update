<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Jut Changelog has moved</title>
  <!-- The changelog now lives on the Jut website (getjut.app/changelog). Kept as a redirect so links in
       older app builds (Settings › Update › Open Changelog) still land on the right page. -->
  <link rel="canonical" href="https://getjut.app/changelog">
  <meta http-equiv="refresh" content="0; url=https://getjut.app/changelog">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <style>
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #0b0b0d; color: rgba(255,255,255,.8);
           font: 15px -apple-system, BlinkMacSystemFont, "SF Pro Text", sans-serif; }
    a { color: #fff; }
  </style>
  <script>location.replace("https://getjut.app/changelog");</script>
</head>
<body>
  <p>The changelog has moved to <a href="https://getjut.app/changelog">getjut.app/changelog</a>.</p>
</body>
</html>
